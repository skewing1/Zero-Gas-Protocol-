name: Solidity tests and gas benchmark

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  evm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.4'
      - name: Install Solidity test dependency
        run: |
          forge install foundry-rs/forge-std@v1.9.7 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git
      - name: Compile Solidity
        run: forge build
      - name: Run EVM tests and capture gas measurements
        run: forge test -vv --gas-report | tee gas-report.txt
      - name: Upload gas report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evm-gas-report
          path: gas-report.txt
          if-no-files-found: error
      - name: Validate reference workload
        run: node --test scripts/validate-workload.mjs
      - name: Test signed service discovery
        run: node --test network/records.test.mjs
      - name: Install relayer and benchmark dependencies
        run: npm --prefix node ci
      - name: Run receipt benchmarks twice
        run: |
          anvil --chain-id 31337 --hardfork prague --mnemonic 'test test test test test test test test test test test junk' > /tmp/receipt-anvil.log 2>&1 &
          trap 'kill "$!"' EXIT
          for attempt in {1..50}; do
            if cast chain-id --rpc-url http://127.0.0.1:8545; then break; fi
            sleep 0.2
          done
          npm --prefix node run build
          node --test node/test/relayer.test.mjs
          node scripts/bench.mjs
          cp bench/results.json /tmp/receipt-results-first.json
          node scripts/bench.mjs
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const gas = path => JSON.parse(readFileSync(path)).map(group =>
              group.paths.map(run => run.receipts.map(tx => tx.gasUsed)));
            assert.deepEqual(gas("/tmp/receipt-results-first.json"), gas("bench/results.json"));
          '
          cat bench/results.md
      - name: Upload receipt benchmark reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: receipt-benchmarks
          path: |
            bench/results.md
            bench/results.json
          if-no-files-found: error
      - name: Run native payment pilot
        run: |
          node scripts/hub/bench-pilot.mjs
          node scripts/hub/bench-pilot.mjs --clearing
          node scripts/hub/bench-pilot.mjs --checkout
      - name: Upload native pilot receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payment-pilot
          path: |
            bench/native-pilot-results.md
            bench/native-pilot-results.json
            bench/native-clearing-results.md
            bench/native-clearing-results.json
            bench/direct-checkout-results.md
            bench/direct-checkout-results.json
          if-no-files-found: error
