name: Hub escape reference model
on:
  push:
    branches: [multichain-hub-v0]
  pull_request:
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.4'
      - run: node --test hub/model/escape.test.mjs hub/spec/exit-safety.test.mjs
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked --manifest-path hub/Cargo.toml -p hub-kernel
      - run: bash scripts/hub/install-sp1.sh
      - name: Compile authentication guest (not a proof or savings benchmark)
        working-directory: hub
        run: PATH="$PWD/.tools/bin:$PATH" cargo prove build --locked -p hub-auth-program
