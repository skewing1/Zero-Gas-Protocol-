<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network transfer</title>
<main>
  <h1>Send ETH</h1>
  <p><label>Recipient wallet <input id="recipient" autocomplete="off" spellcheck="false" placeholder="0x…" size="44"></label></p>
  <p><label>Amount in ETH <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.001"></label></p>
  <button id="connect">Review transfer</button>
  <p id="details" aria-live="polite"></p>
  <p id="fees"></p>
  <button id="pay" disabled>Approve transfer</button>
  <button id="verify" disabled>Check transfer</button>
  <p id="status" aria-live="polite"></p>
  <a id="receipt" hidden>View transaction</a>
</main>
<script type="module" src="/app.mjs"></script>
</html>
